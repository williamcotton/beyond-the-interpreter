name: Project CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Workspace checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rlox
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  extension:
    name: Extension checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rlox/editors/vscode
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.0.0'
          cache: npm
          cache-dependency-path: rlox/editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test grammar scopes
        run: npm test

      - name: Package the extension
        run: npm run package

      - name: Inspect the archive
        run: unzip -l rlox-0.1.0.vsix

      - name: Check display tools
        run: |
          command -v xvfb-run
          command -v xauth

      - name: Test the development extension
        run: xvfb-run -a npm run test:editor

      - name: Test the installed VSIX
        run: xvfb-run -a npm run test:installed
